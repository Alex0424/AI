version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_volume:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    container_name: fast-api-ai
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/chroma_db:/app/chroma_db

volumes:
  ollama_volume:
